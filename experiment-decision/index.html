<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment Decision Reporting | Rui - Product Designer</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f8f9fa;
        }

        /* Navigation */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8%;
            z-index: 9999;
            background: #fff;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        .nav-logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1a1a1a;
            text-decoration: none;
        }

        .nav-logo:hover {
            color: #667eea;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-link {
            font-size: 0.95rem;
            font-weight: 500;
            color: #666;
            padding: 10px 20px;
            border-radius: 24px;
            text-decoration: none;
        }

        .nav-link:hover {
            color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .nav-link.active {
            color: white;
            background: #1a1a1a;
        }

        /* Main content area */
        .content-area {
            position: fixed;
            top: 70px;
            left: 0;
            right: 0;
            bottom: 0;
        }

        /* Loader */
        #loader {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            z-index: 1000;
        }

        /* Progress bar loader */
        .progress-container {
            width: 200px;
            height: 3px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar {
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 3px;
            animation: progressMove 1.5s ease-in-out infinite;
        }

        @keyframes progressMove {
            0% {
                transform: translateX(-100%);
            }
            50% {
                transform: translateX(150%);
            }
            100% {
                transform: translateX(400%);
            }
        }

        .loader-text {
            font-size: 0.95rem;
            color: #888;
            font-weight: 400;
        }

        /* Iframe - positioned from top to show through glass nav */
        #figmaFrame {
            position: relative;
            width: 100%;
            height: calc(100% + 150px);
            border: none;
            display: none;
            z-index: 1;
        }

        .content-area {
            overflow: hidden;
        }

        #figmaFrame.loaded {
            display: block;
        }
    </style>
</head>
<body>

    <nav class="nav">
        <a href="../" class="nav-logo">Rui</a>
        <div class="nav-links">
            <a href="../#projects" class="nav-link active">Projects</a>
            <a href="../about.html" class="nav-link">About</a>
        </div>
    </nav>

    <div class="content-area">
        <div id="loader">
            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>
            <p class="loader-text">Loading prototype</p>
        </div>
        <iframe
            id="figmaFrame"
            src="https://www.figma.com/embed?embed_host=share&url=https%3A%2F%2Fwww.figma.com%2Fproto%2F3cCGa0my1RQRLvUQdY265M%2FRui-s-projects%3Fpage-id%3D2%253A2971%26node-id%3D2-4224%26p%3Df%26viewport%3D522%252C108%252C0.06%26t%3DTQQ4GvpJqbbLV1UB-1%26scaling%3Dscale-down-width%26content-scaling%3Dfixed%26hide-ui%3D1"
            allowfullscreen>
        </iframe>
    </div>

    <script>
        var iframe = document.getElementById('figmaFrame');
        var loader = document.getElementById('loader');
        var loaderText = document.querySelector('.loader-text');

        // Show iframe immediately (behind loader) so it can load
        iframe.style.display = 'block';
        iframe.style.opacity = '0';

        iframe.onload = function() {
            console.log('Figma iframe loaded');
            setTimeout(function() {
                loader.style.display = 'none';
                iframe.style.opacity = '1';
            }, 2000);
        };

        // Fallback: if not loaded after 15 seconds, show anyway
        setTimeout(function() {
            if (loader.style.display !== 'none') {
                loaderText.textContent = 'Still loading...';
            }
        }, 5000);

        setTimeout(function() {
            if (loader.style.display !== 'none') {
                console.log('Fallback: showing iframe after timeout');
                loader.style.display = 'none';
                iframe.style.opacity = '1';
            }
        }, 15000);
    </script>

</body>
</html>
